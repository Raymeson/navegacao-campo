// ==========================

const urlParams = new URLSearchParams(window.location.search);
const pontoAtual = urlParams.get("ponto") || "BASE";

// controle perguntas
let perguntasUsadas = JSON.parse(localStorage.getItem("perguntas_usadas") || "[]");

// controle formatos
let ordemFormatos = JSON.parse(localStorage.getItem("ordem_formatos") || "null");
let indiceFormato = parseInt(localStorage.getItem("indice_formato") || "0");

// ==========================
// 🎲 FORMATO (sem repetir)
// ==========================

function gerarOrdemFormatos() {
  const formatos = ["utm", "decimal", "dms"];

  for (let i = formatos.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [formatos[i], formatos[j]] = [formatos[j], formatos[i]];
  }

  localStorage.setItem("ordem_formatos", JSON.stringify(formatos));
  localStorage.setItem("indice_formato", "0");

  return formatos;
}

function getProximoFormato() {
  if (!ordemFormatos || indiceFormato >= 3) {
    ordemFormatos = gerarOrdemFormatos();
    indiceFormato = 0;
  }

  const formato = ordemFormatos[indiceFormato];
  indiceFormato++;

  localStorage.setItem("indice_formato", indiceFormato);

  return formato;
}

// ==========================
// ❓ PERGUNTAS
// ==========================

function pegarPergunta() {
  if (perguntasUsadas.length >= perguntas.length) {
    perguntasUsadas = [];
  }

  let index;
  do {
    index = Math.floor(Math.random() * perguntas.length);
  } while (perguntasUsadas.includes(index));

  perguntasUsadas.push(index);
  localStorage.setItem("perguntas_usadas", JSON.stringify(perguntasUsadas));

  return perguntas[index];
}

// ==========================
// 🧭 FLUXO
// ==========================

function escolherTrilha() {
  let html = "<h3>Selecione sua trilha</h3>";
  for (let t in trilhas) {
    html += `<button onclick="selecionarTrilha('${t}')">${t}</button>`;
  }
  document.getElementById("conteudo").innerHTML = html;
}

function selecionarTrilha(trilha) {
  localStorage.setItem("trilha", trilha);

  // reset progresso
  localStorage.removeItem("ultimo_ponto");
  localStorage.removeItem("ordem_formatos");
  localStorage.removeItem("indice_formato");
  localStorage.removeItem("perguntas_usadas");
  localStorage.removeItem("progresso");
  
  localStorage.setItem("progresso", "0");
  mostrarPergunta();
}

function mostrarPergunta() {
  const p = pegarPergunta();

  let html = `
    <div class="card">
      <h3>${p.pergunta}</h3>
  `;

  p.opcoes.forEach((op, i) => {
    html += `
      <button onclick="responder(${i}, ${p.correta})">
        ${String.fromCharCode(65 + i)}) ${op}
      </button>
    `;
  });

  html += "</div>";

  document.getElementById("conteudo").innerHTML = html;
}

function responder(resp, correta) {
  if (resp === correta) {
    validarRota();
  } else {
    document.getElementById("conteudo").innerHTML =
    "<h3 class='erro'>❌ Resposta incorreta</h3><p>Aguarde 5 segundos...</p>";

    setTimeout(mostrarPergunta, 5000);
  }
}

// ==========================
// ✅ VALIDAÇÃO
// ==========================

function validarRota() {
  const trilha = localStorage.getItem("trilha");

  if (!trilha) {
    escolherTrilha();
    return;
  }

  const sequencia = trilhas[trilha];
  let progresso = parseInt(localStorage.getItem("progresso"));

  if (isNaN(progresso)) {
    progresso = 0;
  }

  // 📍 ponto vindo do QRCode
  const pontoLido = pontoAtual;

  // 🎯 PRIMEIRO PASSO (saindo da base)
  if (progresso === 0) {
    const esperado = sequencia[0];

    if (pontoLido !== "BASE" && pontoLido !== esperado) {
      document.getElementById("conteudo").innerHTML =
        `<h3 class='erro'>❌ Fora da trilha</h3>
         <p>Você não está no ponto correto da sua trilha.</p>`;
      return;
    }

    const formato = getProximoFormato();
    const coord = coordenadas[esperado][formato];

    localStorage.setItem("progresso", "1");

    mostrarCoordenada(coord, formato, trilha, "Primeiro ponto:");
    return;
  }

// 🎯 VALIDAÇÃO NORMAL CORRIGIDA
const pontoEsperado = sequencia[progresso - 1];

// valida onde você ESTÁ
if (pontoLido !== pontoEsperado) {
  document.getElementById("conteudo").innerHTML =
    `<h3 class='erro'>❌ Fora da trilha</h3>
     <p>Você está em <strong>${pontoLido}</strong>, mas deveria estar em <strong>${pontoEsperado}</strong>.</p>
     <button onclick="mostrarPergunta()">Tentar novamente</button>`;
  return;
}

// 🎉 FINAL
if (progresso >= sequencia.length) {
  document.getElementById("conteudo").innerHTML =
    "<h2>🎉 Parabéns!</h2><p>Você concluiu sua trilha. Retorne à base!</p>";
  return;
}

const proximoIndex = progresso;

if (proximoIndex >= sequencia.length) {
  document.getElementById("conteudo").innerHTML =
    "<h2>🎉 Parabéns!</h2><p>Você concluiu sua trilha. Retorne à base!</p>";
  return;
}

const proximo = sequencia[proximoIndex];

// só depois atualiza
localStorage.setItem("progresso", proximoIndex + 1);

const formato = getProximoFormato();
const coord = coordenadas[proximo][formato];

mostrarCoordenada(coord, formato, trilha, "Próximo ponto:");
}
// ==========================
// 📍 EXIBIÇÃO
// ==========================

function mostrarCoordenada(coord, formato, trilha, titulo) {

  const tipoTexto = {
    utm: "UTM",
    decimal: "Grau Decimal",
    dms: "Grau, Minuto e Segundo"
  };

 document.getElementById("conteudo").innerHTML = `
  <div class="card">
    <h3 class="sucesso">✅ Correto!</h3>
    <p><strong>Trilha:</strong> ${trilha}</p>
    <p><strong>Ponto atual (QR):</strong> ${pontoAtual}</p>
    <p><strong>Formato:</strong> ${tipoTexto[formato]}</p>
    <p>${titulo}</p>
    <div class="coordenada">${coord}</div>

    <button onclick="localStorage.clear(); location.reload();">
      Reiniciar exercício
    </button>
  </div>
`;
}

// ==========================
// 🚀 INÍCIO CORRIGIDO
// ==========================

const trilhaSalva = localStorage.getItem("trilha");

if (!trilhaSalva) {
  escolherTrilha();
} else {
  // já tem trilha → continua fluxo normal
  mostrarPergunta();
}
