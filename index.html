// ==========================

function gerarOrdemFormatos() {
  const formatos = ["utm", "decimal", "dms"];

  for (let i = formatos.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [formatos[i], formatos[j]] = [formatos[j], formatos[i]];
  }

  localStorage.setItem("ordem_formatos", JSON.stringify(formatos));
  localStorage.setItem("indice_formato", "0");

  return formatos;
}

function getProximoFormato() {
  if (!ordemFormatos || indiceFormato >= 3) {
    ordemFormatos = gerarOrdemFormatos();
    indiceFormato = 0;
  }

  const formato = ordemFormatos[indiceFormato];
  indiceFormato++;

  localStorage.setItem("indice_formato", indiceFormato);

  return formato;
}

function pegarPergunta() {
  if (perguntasUsadas.length >= perguntas.length) {
    perguntasUsadas = [];
  }

  let index;
  do {
    index = Math.floor(Math.random() * perguntas.length);
  } while (perguntasUsadas.includes(index));

  perguntasUsadas.push(index);
  localStorage.setItem("perguntas_usadas", JSON.stringify(perguntasUsadas));

  return perguntas[index];
}

  let html = "<h3>Selecione sua trilha</h3>";

    html += `<button onclick="selecionarTrilha('${t}')">${t}</button>`;
  }
  document.getElementById("conteudo").innerHTML = html;
}

function selecionarTrilha(trilha) {
  localStorage.setItem("trilha", trilha);

  // reset progresso
  localStorage.removeItem("ultimo_ponto");
  localStorage.removeItem("ordem_formatos");
  localStorage.removeItem("indice_formato");
  localStorage.removeItem("perguntas_usadas");
  localStorage.removeItem("progresso");
  
  localStorage.setItem("progresso", "0");
  mostrarPergunta();
}

function mostrarPergunta() {
  const p = pegarPergunta();

  let html = `
    <div class="card">

  `;

  p.opcoes.forEach((op, i) => {
    html += `
      <button onclick="responder(${i}, ${p.correta})">
        ${String.fromCharCode(65 + i)}) ${op}
      </button>
    `;
  });

  html += "</div>";

  document.getElementById("conteudo").innerHTML = html;
}

function responder(resp, correta) {
  if (resp === correta) {
    validarRota();

    document.getElementById("conteudo").innerHTML =
    "<h3 class='erro'>❌ Resposta incorreta</h3><p>Aguarde 5 segundos...</p>";

    setTimeout(mostrarPergunta, 5000);
  }
}

// 🎯 VALIDAÇÃO NORMAL CORRIGIDA

if (proximoIndex >= sequencia.length) {
  document.getElementById("conteudo").innerHTML =
   "<h2>🎉 Parabéns!</h2><p>Você concluiu sua trilha.</p><button onclick='reiniciarExercicio()'>🔄 Novo exercício</button>";
  return;
}

const proximo = sequencia[proximoIndex];

// só depois atualiza
localStorage.setItem("progresso", proximoIndex + 1);

const formato = getProximoFormato();
const coord = coordenadas[proximo][formato];

mostrarCoordenada(coord, formato, trilha, "Próximo ponto:");
}
// ==========================
// 📍 EXIBIÇÃO
// ==========================

function mostrarCoordenada(coord, formato, trilha, titulo) {

  const tipoTexto = {
    utm: "UTM",
    decimal: "Grau Decimal",
    dms: "Grau, Minuto e Segundo"
  };

 document.getElementById("conteudo").innerHTML = `
  <div class="card">
    <h3 class="sucesso">✅ Ponto confirmado</h3>
    <p><strong>Trilha:</strong> ${trilha}</p>
    <p><strong>Ponto atual (QR):</strong> ${pontoAtual}</p>
    <p><strong>Formato:</strong> ${tipoTexto[formato]}</p>
    <p>${titulo}</p>
    <div class="coordenada">${coord}</div>

    <button onclick="reiniciarExercicio()">🔄 Reiniciar exercício </button>
  </div>
`;
}

  function reiniciarExercicio() {
  localStorage.clear();
  window.location.href = window.location.pathname + "?ponto=BASE";
}
// ==========================
// 🚀 INÍCIO CORRIGIDO
// ==========================

const trilhaSalva = localStorage.getItem("trilha");

if (pontoAtual === "BASE") {
  escolherTrilha();
} else if (!trilhaSalva) {
  window.location.href = window.location.pathname + "?ponto=BASE";
} else {
  mostrarPergunta();
}

</script>
